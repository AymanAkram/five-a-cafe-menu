function fmtTime(ts){ var d=new Date(ts); return d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+' — '+d.toLocaleDateString('ar-EG'); }

var CAFE_TZ='Africa/Cairo';
var cafeDTF=new Intl.DateTimeFormat('en-US',{timeZone:CAFE_TZ,year:'numeric',month:'numeric',day:'numeric'});
function cafeParts(ts){ var o={}; cafeDTF.formatToParts(new Date(ts)).forEach(function(x){o[x.type]=x.value;}); return {y:+o.year,m:+o.month,d:+o.day}; }
function dayKey(ts){ var c=cafeParts(ts); return c.y+'-'+c.m+'-'+c.d; }
function cafeTodayKey(){ return dayKey(Date.now()); }
function cafeYesterdayKey(){ var c=cafeParts(Date.now()); var dt=new Date(Date.UTC(c.y,c.m-1,c.d)-86400000); return dt.getUTCFullYear()+'-'+(dt.getUTCMonth()+1)+'-'+dt.getUTCDate(); }
function dayName(ts){ return new Date(ts).toLocaleDateString('ar-EG',{timeZone:CAFE_TZ,weekday:'long',day:'numeric',month:'long'}); }
function dayLabel(key,ts){
  if(key===cafeTodayKey()) return 'النهارده · '+dayName(ts);
  if(key===cafeYesterdayKey()) return 'إمبارح · '+dayName(ts);
  return dayName(ts);
}
function tzOffsetMinutes(date){ var p={}; new Intl.DateTimeFormat('en-US',{timeZone:CAFE_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(date).forEach(function(x){p[x.type]=x.value;}); return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second)-date.getTime())/60000; }
function cairoDayBounds(dateStr){ var parts=dateStr.split('-'); var y=+parts[0],m=+parts[1],d=+parts[2];
  var g1=Date.UTC(y,m-1,d,0,0,0); var start=new Date(g1-tzOffsetMinutes(new Date(g1))*60000);
  var g2=Date.UTC(y,m-1,d+1,0,0,0); var end=new Date(g2-tzOffsetMinutes(new Date(g2))*60000);
  return [start.toISOString(),end.toISOString()];
}

      '<ul class="items">'+items+'</ul>'+

      '<button type="button" class="photo-toggle" aria-expanded="'+(photoOpen[o.id]?'true':'false')+'" aria-controls="photo-'+o.id+'" onclick="togglePhoto(\''+o.id+'\')">'+(photoOpen[o.id]?'إخفاء الصورة':'عرض صورة الترابيزة')+'</button>'+
      '<div id="photo-'+o.id+'" class="photo-review"'+(photoOpen[o.id]?'':' hidden')+'>جاري تحميل صورة الترابيزة...</div>'+
      (o.photo_checked?'<p class="photo-ok compact-confirm">✓ تم تأكيد الترابيزة</p>':'')+
      (isDone?'<p class="photo-ok">تم التجهيز ✓</p>':(o.status==='preparing'?'<p class="photo-ok">جاري التحضير</p>':'<button class="done-btn" onclick="startPreparing(\''+o.id+'\')">تأكيد الطلب وبدء التحضير</button>')+'<button class="done-btn" onclick="markDone(\''+o.id+'\')">تم التجهيز ✓</button>')+
      '</div>';
  }
  var groups=[],byDay={};
  done.forEach(function(o){var k=dayKey(o.created_at);if(!byDay[k]){byDay[k]={key:k,ts:o.created_at,orders:[]};groups.push(byDay[k]);}byDay[k].orders.push(o);});
  var daysHtml=groups.map(function(g){
    if(dayOpen[g.key]===undefined)dayOpen[g.key]=(g.key===todayKey);
    return '<button type="button" class="day-toggle" aria-expanded="'+dayOpen[g.key]+'" onclick="toggleDay(\''+g.key+'\')"><span>'+esc(dayLabel(g.key,g.ts))+' · '+g.orders.length+' طلب</span></button>'+
      '<div class="day-group"'+(dayOpen[g.key]?'':' hidden')+'>'+g.orders.map(function(o){return card(o,true);}).join('')+'</div>';
  }).join('');
  var moreHtml='';
  if(done.length){
    if(doneHasMore) moreHtml='<button type="button" class="day-toggle older-toggle" onclick="loadOlder()">'+(loadingOlder?'جاري تحميل طلبات أقدم...':'عرض طلبات أقدم من السجل')+'</button>';
    else moreHtml='<div class="empty history-note">دي كل الطلبات المحفوظة، من أول يوم شغل</div>';
  }
  var bar='<div class="filter-bar">'+
    '<input type="date" id="f-date" value="'+esc(filters.date)+'" onchange="filters.date=this.value" aria-label="البحث بتاريخ اليوم">'+
    '<input type="text" inputmode="numeric" id="f-no" placeholder="رقم الطلب" value="'+esc(filters.no)+'" oninput="filters.no=this.value" aria-label="البحث برقم الطلب">'+
    '<button type="button" class="f-btn" onclick="applyFilter()">'+(filterLoading?'جاري البحث...':'بحث')+'</button>'+
    (filterActive?'<button type="button" class="f-btn clear" onclick="clearFilter()">مسح</button>':'')+
    '</div>';
  var historyHtml;
  if(filterActive){
    var results=filterRows.map(function(o){return card(o,o.status==='done');}).join('');
    var tail='';
    if(filterRows.length){
      if(filterHasMore) tail='<button type="button" class="day-toggle older-toggle" onclick="loadFilterPage()">'+(filterLoading?'جاري التحميل...':'عرض نتائج أقدم')+'</button>';
      else tail='<div class="empty history-note">نهاية النتائج</div>';
    }
    historyHtml=bar+'<div class="sec-t">نتائج البحث في السجل ('+filterRows.length+')</div>'+
      (filterRows.length? results+tail : (filterLoading?'<div class="empty">جاري البحث...</div>':'<div class="empty">مفيش طلبات مطابقة للبحث ده</div>'));
  }else{
    historyHtml=bar+'<div class="sec-t">الطلبات المُنجزة حسب اليوم</div>'+
      (done.length? daysHtml+moreHtml : '<div class="empty">لسه مفيش</div>');
  }
  box.innerHTML =
    '<div class="sec-t">طلبات محتاجة تجهيز ('+open.length+')</div>'+
    (open.length? open.map(function(o){return card(o,false);}).join('') : '<div class="empty">مفيش طلبات محتاجة تجهيز</div>')+
    historyHtml;
}

async function loadPhotos(orders){
 const generation=authGeneration;
 confirmedPhotos={}; for(const o of orders)if(o.photo_checked)confirmedPhotos[o.id]=true;
 for(var o of orders){
  var box=document.getElementById('photo-'+o.id);if(!box||!photoOpen[o.id])continue;
  var r=photoCache[o.id] && Date.parse(photoCache[o.id].expires_at)>Date.now()?{data:photoCache[o.id]}:await sb.from('order_photos').select('jpeg_base64,expires_at').eq('order_id',o.id).maybeSingle();
  if(generation!==authGeneration)return;
  if(r.data)photoCache[o.id]=r.data;
  if(r.error){box.textContent='تعذر تحميل الصورة. لا تبدأ التحضير قبل مراجعة الترابيزة.';continue;}
  if(!r.data){box.textContent='الصورة غير متاحة أو انتهت مدتها. تأكد من الترابيزة مباشرة قبل التحضير.';if(o.photo_checked)confirmedPhotos[o.id]=true;else if(o.status!=='done'){var direct=document.createElement('button');direct.textContent='تأكدت من الترابيزة مباشرة';direct.addEventListener('click',(function(id){return async function(){var result=await sb.from('orders').update({photo_checked:true}).eq('id',id);if(result.error){alert('لم يتم الحفظ');return;}refresh();};})(o.id));box.appendChild(direct);}continue;}
  var img=document.createElement('img');img.className='table-photo';img.alt='صورة رقم الترابيزة '+o.table_no;img.src='data:image/jpeg;base64,'+r.data.jpeg_base64;
  box.textContent='صورة خاصة، طابق الرقم الظاهر مع الترابيزة '+o.table_no+' قبل التحضير. تختفي بعد ٢٤ ساعة.';box.appendChild(img);
  if(o.photo_checked){confirmedPhotos[o.id]=true;var ok=document.createElement('p');ok.className='photo-ok';ok.textContent='✓ تم تأكيد مطابقة رقم الترابيزة';box.appendChild(ok);}
  else if(o.status!=='done'){
   var b=document.createElement('button');b.className='done-btn';b.textContent='راجعت الصورة والرقم مطابق';
   b.addEventListener('click',(function(order){return async function(){
    var result=await sb.from('orders').update({photo_checked:true}).eq('id',order.id);if(result.error){alert('لم يتم حفظ المراجعة، حاول تاني');return;}await refresh();
   };})(o));box.appendChild(b);
  }
  (function(el,expiry){setTimeout(function(){delete photoCache[el.id.replace('photo-','')];el.textContent='انتهت مدة عرض الصورة. تأكد مباشرة من الترابيزة عند الحاجة.';},Math.max(0,Date.parse(expiry)-Date.now()));})(box,r.data.expires_at);
 }
}

window.togglePhoto=async function(id){photoOpen[id]=!photoOpen[id];render(currentOrders);await loadPhotos(currentOrders)};
window.applyFilter=async function(){
  var fd=document.getElementById('f-date'),fn=document.getElementById('f-no');
  if(fd)filters.date=fd.value; if(fn)filters.no=fn.value.trim();
  if(!filters.date&&!filters.no)return;
  filterActive=true;filterRows=[];filterCursor=null;filterHasMore=true;
  await loadFilterPage();
};
window.clearFilter=function(){filters.date='';filters.no='';filterActive=false;filterRows=[];filterCursor=null;filterHasMore=false;render(currentOrders);};
window.loadFilterPage=async function(){
  if(filterLoading)return;
  filterLoading=true;render(currentOrders);
  const generation=authGeneration;
  var q=sb.from('orders').select(COLS).order('order_no',{ascending:false}).limit(DONE_PAGE);
  if(filters.no){var n=parseInt(filters.no,10);if(!isNaN(n))q=q.eq('order_no',n);}
  if(filters.date){var b=cairoDayBounds(filters.date);q=q.gte('created_at',b[0]).lt('created_at',b[1]);}
  if(filterCursor!=null)q=q.lt('order_no',filterCursor);
  var r=await q;
  filterLoading=false;
  if(generation!==authGeneration)return;
  if(r.error){alert('مشكلة في البحث، حاول مرة أخرى');render(currentOrders);return;}
  var rows=r.data||[];var have={};filterRows.forEach(function(o){have[o.id]=1;});
  rows=rows.filter(function(o){return !have[o.id];});
  filterRows=filterRows.concat(rows);
  filterHasMore=rows.length===DONE_PAGE;
  if(rows.length)filterCursor=rows[rows.length-1].order_no;
  render(currentOrders);
};
window.loadOlder=async function(){
  if(loadingOlder)return;
  loadingOlder=true;render(currentOrders);
  const generation=authGeneration;
  var q=sb.from('orders').select(COLS).eq('status','done').order('order_no',{ascending:false}).limit(DONE_PAGE);
  if(doneCursor!=null)q=q.lt('order_no',doneCursor);
  var r=await q;
  loadingOlder=false;
  if(generation!==authGeneration)return;
  if(r.error){alert('لم يتم تحميل الطلبات الأقدم، حاول مرة أخرى');render(currentOrders);return;}
  var rows=r.data||[];var have={};currentOrders.forEach(function(o){have[o.id]=1;});
  rows=rows.filter(function(o){return !have[o.id];});
  doneOlder=doneOlder.concat(rows);
  doneHasMore=rows.length===DONE_PAGE;
  if(rows.length)doneCursor=rows[rows.length-1].order_no;
  currentOrders=currentOrders.concat(rows);
  render(currentOrders);
};
async function refresh(){
  const generation=authGeneration;
var r1={data:[],error:null};
  for(var off=0;;off+=500){
    var page=await sb.from('orders').select(COLS).neq('status','done').order('order_no',{ascending:false}).range(off,off+499);
    if(page.error){r1=page;break;}
    r1.data=r1.data.concat(page.data||[]);
    if((page.data||[]).length<500)break;
  }
  if(generation!==authGeneration)return;
  if(r1.error){ document.getElementById('live').textContent='فشل التحديث، تحقق من الإنترنت وأعد تحميل الصفحة'; document.getElementById('orders').innerHTML='<div class="empty">مشكلة في التحميل: '+esc(r1.error.message)+'</div>'; return; }
  var r2=await sb.from('orders').select(COLS).eq('status','done').order('order_no',{ascending:false}).limit(DONE_PAGE);
  if(generation!==authGeneration)return;
  if(r2.error){ document.getElementById('live').textContent='فشل التحديث، تحقق من الإنترنت وأعد تحميل الصفحة'; document.getElementById('orders').innerHTML='<div class="empty">مشكلة في التحميل: '+esc(r2.error.message)+'</div>'; return; }
  var recent=r2.data||[];var recentIds={};recent.forEach(function(o){recentIds[o.id]=1;});
  doneOlder=doneOlder.filter(function(o){return !recentIds[o.id];});
  doneHasMore = recent.length===DONE_PAGE ? true : (doneOlder.length ? doneHasMore : false);
  var tail=doneOlder.length?doneOlder[doneOlder.length-1]:(recent.length?recent[recent.length-1]:null);
  doneCursor=tail?tail.order_no:null;
  var r={data:(r1.data||[]).concat(recent,doneOlder)};
  if(generation!==authGeneration)return;
  if(r.error){ document.getElementById('live').textContent='فشل التحديث، تحقق من الإنترنت وأعد تحميل الصفحة'; document.getElementById('orders').innerHTML='<div class="empty">مشكلة في التحميل: '+esc(r.error.message)+'</div>'; return; }
  currentOrders=r.data||[];render(currentOrders);
  await loadPhotos(r.data||[]);
  document.getElementById('live').textContent='آخر تحديث '+new Date().toLocaleTimeString('ar-EG')+' · تحديث تلقائي كل 30 ثانية';
}

window.startPreparing=async function(id){
 if(!confirmedPhotos[id]){alert('راجع رقم الترابيزة أولًا قبل بدء التحضير');return;}
 var result=await sb.from('orders').update({status:'preparing'}).eq('id',id);
 if(result.error){alert('لم يتم الحفظ، حاول مرة أخرى');return;}refresh();
};
window.markDone=async function(id){
  if(!confirmedPhotos[id]){alert('طابق رقم الترابيزة في الصورة ووافق عليه أولًا. لو الصورة انتهت، تأكد مباشرة من الترابيزة.');return;}
  var result=await sb.from('orders').update({status:'done'}).eq('id', id);
  if(result.error){alert('لم يتم حفظ التغيير. حاول مرة أخرى');return;}
  refresh();
};

async function startAuthed(fresh=false){
