<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>طلبات الكاشير — 5A</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;background:#f4f1ea;color:#1f3b2d;min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  h1{font-size:20px;padding:18px 0 12px;text-align:center}
  .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(31,59,45,.08);margin-bottom:14px}
  label{display:block;font-size:13px;margin:10px 0 4px;font-weight:700}
  input{width:100%;padding:11px 12px;border:1.5px solid #d8d2c4;border-radius:10px;font-size:15px;background:#fbfaf6}
  button{cursor:pointer;border:0;border-radius:10px;font-weight:700;font-size:15px;padding:12px 18px;background:#1f3b2d;color:#f5f2e9}
  .btn-full{width:100%;margin-top:14px}
  .err{color:#a13225;font-size:13px;margin-top:10px;min-height:16px}
  .ord{border-right:5px solid #c98f2d}
  .ord.done{border-right-color:#9aa79b;opacity:.72}
  .ord-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .ord-no{font-size:18px;font-weight:800}
  .tbl{background:#c98f2d;color:#fff;border-radius:8px;padding:3px 12px;font-weight:800;font-size:15px}
  .meta{font-size:12px;color:#7a7364;margin-top:2px}
  .items{margin:10px 0 0;padding-right:14px;font-size:15px;line-height:1.9}
  .note{background:#fdf6e3;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  .table-photo{display:block;width:100%;max-height:360px;object-fit:contain;border-radius:8px;margin-top:10px}.photo-review{font-size:13px;background:#fdf6e3;padding:10px;border-radius:8px;margin-top:8px}.photo-ok{color:#416647;font-weight:700;margin-top:8px}.done-btn{background:#5c7a5e;margin-top:10px;width:100%}
  .sec-t{font-size:15px;font-weight:800;margin:18px 0 8px;color:#6a6355}
  .out{position:fixed;top:10px;left:10px;background:none;color:#7a7364;font-size:13px;padding:6px}
  #live{display:none;text-align:center;font-size:12px;color:#5c7a5e;padding-bottom:8px}
  .empty{text-align:center;color:#9aa79b;padding:22px 0;font-size:14px}
.photo-review[hidden]{display:none!important}.photo-toggle{display:block;width:100%;margin-top:12px;background:transparent;color:#324b36;border:1px solid #bdc8b3;border-radius:10px;padding:9px;font:inherit;font-size:12px}.compact-confirm{font-size:11px;margin:8px 0 0}.photo-review{margin-top:10px}

body{background:#f2efe5;color:#3f5137}.wrap{max-width:820px;padding:18px}h1{font-size:19px;font-weight:600;padding:24px 0;color:#667d53}.card{background:#fffdf6;border:1px solid #dde0d0;border-radius:22px;box-shadow:0 10px 26px #5b70490a;padding:20px;margin-bottom:16px}input{border:1px solid #cdd6bd;background:#fffef8;border-radius:12px}button{background:#7b8e6d;border-radius:13px;font-weight:500}.ord{border-right:3px solid #a2b391}.ord.done{border-right-color:#c0cbb1;opacity:.85}.tbl{background:#e1e8d4;color:#5b7048;font-size:13px;border-radius:10px;padding:4px 11px}.ord-no{font-size:17px;font-weight:600}.items{font-size:14px;line-height:2}.meta{color:#869078;font-size:11px}.note{background:#f0f1e5;font-size:12px;border-radius:12px;padding:10px 12px}.photo-toggle{color:#637952;border-color:#ccd7bc;border-radius:12px;padding:11px}.done-btn{background:#839773;font-size:13px}.photo-review{background:#f0f1e5;border-radius:14px}.photo-ok{color:#7c906b;font-size:12px}.sec-t{color:#849174;font-weight:500;font-size:13px;margin:24px 0 13px}#reviews-admin h2{font-size:19px;font-weight:500;margin-bottom:10px}#reviews-admin-refresh{margin:15px 0}#reviews-admin-list .card{margin-top:16px}#reviews-admin-list p{line-height:1.9;margin:12px 0}
.order-addons{list-style:none;padding:4px 12px 6px 0;margin:4px 0;border-right:2px solid #ccd6bc}.order-addon{font-size:12px;color:#6b805a;line-height:1.9}
button,.add-btn,.card-add,.nv{min-height:44px}.qty-ctl button{width:44px;min-width:44px;height:44px}.mi .add-btn{min-height:44px;padding:9px 14px}.nwrap{min-height:68px}body.menu-active #cart-fab{top:12px;width:44px;height:44px}.cart-addon .qty-ctl button{width:44px;min-width:44px;height:44px}.cart-addon{flex-wrap:wrap;gap:8px}.cart-addon .ca-info{flex:1 1 100%}.cart-addon .ca-price{margin-inline-start:auto}.ci-rm,#cart-close{min-width:44px;min-height:44px}.mi{min-height:92px}@media(max-width:380px){.cart-row{flex-wrap:wrap}.cart-row .ci-info{flex:1 1 calc(100% - 60px)}.cart-row .qty-ctl{order:3}.cart-row .ci-line{order:4;flex:1}.cart-row .ci-rm{order:2}}
</style>
</head>
<body>
<div class="wrap">
  <h1>5A — شاشة الطلبات</h1>

  <div class="card" id="login-card">
    <label>الإيميل</label>
    <input id="email" type="email" autocomplete="username" dir="ltr">
    <label>كلمة السر</label>
    <input id="pw" type="password" autocomplete="current-password" dir="ltr">
    <button class="btn-full" id="login-btn">دخول</button>
    <div class="err" id="login-err"></div>
  </div>

  <div id="live">جاري تحميل الطلبات...</div>
  <div id="orders"></div>

</div>

<script>
var SUPA_URL='https://gglkftkdpfmwuvdeytur.supabase.co';
var SUPA_KEY='sb_publishable_u3BCukoQW8b4AVMGOLSOLw_6Yh_vi4a';
var sb=supabase.createClient(SUPA_URL, SUPA_KEY);
var names={},confirmedPhotos={},photoCache={},photoOpen={},currentOrders=[];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtTime(ts){ var d=new Date(ts); return d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+' — '+d.toLocaleDateString('ar-EG'); }

async function loadNames(){
  if(Object.keys(names).length) return;
  var r=await sb.from('menu_items').select('sku,en,ar');
  (r.data||[]).forEach(function(m){ names[m.sku]=m; });
}
function itemName(sku){ var m=names[sku]; return m ? (m.ar+' · '+m.en) : sku; }

function render(orders){
  var box=document.getElementById('orders');
  var open=orders.filter(function(o){return o.status!=='done';});
  var done=orders.filter(function(o){return o.status==='done';}).slice(0,20);
  function card(o, isDone){
    var lines=o.order_items||[];var items=lines.filter(i=>!i.parent_sku).map(function(i){var extra=lines.filter(a=>a.parent_sku===i.sku).map(a=>'<li class="order-addon">↳ '+a.qty+' × '+esc(itemName(a.sku))+(a.addon_detail?' · '+esc(a.addon_detail):'')+' · '+(a.unit_price*a.qty)+' ج.م</li>').join('');return '<li>'+i.qty+' × '+esc(itemName(i.sku))+(extra?'<ul class="order-addons">'+extra+'</ul>':'')+'</li>';}).join('');
    return '<div class="card ord'+(isDone?' done':'')+'">'+
      '<div class="ord-head"><span class="ord-no">طلب #'+o.order_no+'</span>'+
      '<span class="tbl">ترابيزة '+esc(o.table_no)+'</span></div>'+
      '<div class="meta">'+fmtTime(o.created_at)+' — الإجمالي '+o.total+' ج.م</div>'+
      '<ul class="items">'+items+'</ul>'+
      (o.note?'<div class="note">ملاحظة: '+esc(o.note)+'</div>':'')+
      '<button type="button" class="photo-toggle" aria-expanded="'+(photoOpen[o.id]?'true':'false')+'" aria-controls="photo-'+o.id+'" onclick="togglePhoto(\''+o.id+'\')">'+(photoOpen[o.id]?'إخفاء الصورة':'عرض صورة الترابيزة')+'</button>'+
      '<div id="photo-'+o.id+'" class="photo-review"'+(photoOpen[o.id]?'':' hidden')+'>جاري تحميل صورة الترابيزة...</div>'+
      (o.photo_checked?'<p class="photo-ok compact-confirm">✓ تم تأكيد الترابيزة</p>':'')+
      (isDone?'<p class="photo-ok">تم التجهيز ✓</p>':(o.status==='preparing'?'<p class="photo-ok">جاري التحضير</p>':'<button class="done-btn" onclick="startPreparing(\''+o.id+'\')">تأكيد الطلب وبدء التحضير</button>')+'<button class="done-btn" onclick="markDone(\''+o.id+'\')">تم التجهيز ✓</button>')+
      '</div>';
  }
  box.innerHTML =
    '<div class="sec-t">طلبات جديدة ('+open.length+')</div>'+
    (open.length? open.map(function(o){return card(o,false);}).join('') : '<div class="empty">مفيش طلبات جديدة</div>')+
    '<div class="sec-t">آخر الطلبات المُنجزة</div>'+
    (done.length? done.map(function(o){return card(o,true);}).join('') : '<div class="empty">لسه مفيش</div>');
}

async function loadPhotos(orders){
 confirmedPhotos={}; for(const o of orders)if(o.photo_checked)confirmedPhotos[o.id]=true;
 for(var o of orders){
  var box=document.getElementById('photo-'+o.id);if(!box||!photoOpen[o.id])continue;
  var r=photoCache[o.id] && Date.parse(photoCache[o.id].expires_at)>Date.now()?{data:photoCache[o.id]}:await sb.from('order_photos').select('jpeg_base64,expires_at').eq('order_id',o.id).maybeSingle();
  if(r.data)photoCache[o.id]=r.data;
  if(r.error){box.textContent='تعذر تحميل الصورة. لا تبدأ التحضير قبل مراجعة الترابيزة.';continue;}
  if(!r.data){box.textContent='الصورة غير متاحة أو انتهت مدتها. تأكد من الترابيزة مباشرة قبل التحضير.';if(o.photo_checked)confirmedPhotos[o.id]=true;else if(o.status!=='done'){var direct=document.createElement('button');direct.textContent='تأكدت من الترابيزة مباشرة';direct.addEventListener('click',(function(id){return async function(){var result=await sb.from('orders').update({photo_checked:true}).eq('id',id);if(result.error){alert('لم يتم الحفظ');return;}refresh();};})(o.id));box.appendChild(direct);}continue;}
  var img=document.createElement('img');img.className='table-photo';img.alt='صورة رقم الترابيزة '+o.table_no;img.src='data:image/jpeg;base64,'+r.data.jpeg_base64;
  box.textContent='صورة خاصة، طابق الرقم الظاهر مع الترابيزة '+o.table_no+' قبل التحضير. تختفي بعد ٢٤ ساعة.';box.appendChild(img);
  if(o.photo_checked){confirmedPhotos[o.id]=true;var ok=document.createElement('p');ok.className='photo-ok';ok.textContent='✓ تم تأكيد مطابقة رقم الترابيزة';box.appendChild(ok);}
  else if(o.status!=='done'){
   var b=document.createElement('button');b.className='done-btn';b.textContent='راجعت الصورة والرقم مطابق';
   b.addEventListener('click',(function(order){return async function(){
    var result=await sb.from('orders').update({photo_checked:true}).eq('id',order.id);if(result.error){alert('لم يتم حفظ المراجعة، حاول تاني');return;}await refresh();
   };})(o));box.appendChild(b);
  }
  (function(el,expiry){setTimeout(function(){delete photoCache[el.id.replace('photo-','')];el.textContent='انتهت مدة عرض الصورة. تأكد مباشرة من الترابيزة عند الحاجة.';},Math.max(0,Date.parse(expiry)-Date.now()));})(box,r.data.expires_at);
 }
}

window.togglePhoto=async function(id){photoOpen[id]=!photoOpen[id];render(currentOrders);await loadPhotos(currentOrders)};
async function refresh(){
  var r=await sb.from('orders').select('id,order_no,table_no,note,status,total,created_at,photo_checked,order_items(sku,qty,unit_price,parent_sku,addon_detail)').order('order_no',{ascending:false}).limit(50);
  if(r.error){ document.getElementById('live').textContent='فشل التحديث، تحقق من الإنترنت وأعد تحميل الصفحة'; document.getElementById('orders').innerHTML='<div class="empty">مشكلة في التحميل: '+esc(r.error.message)+'</div>'; return; }
  currentOrders=r.data||[];render(currentOrders);
  await loadPhotos(r.data||[]);
  document.getElementById('live').textContent='آخر تحديث '+new Date().toLocaleTimeString('ar-EG')+' · تحديث تلقائي كل 30 ثانية';
}

window.startPreparing=async function(id){
 if(!confirmedPhotos[id]){alert('راجع رقم الترابيزة أولًا قبل بدء التحضير');return;}
 var result=await sb.from('orders').update({status:'preparing'}).eq('id',id);
 if(result.error){alert('لم يتم الحفظ، حاول مرة أخرى');return;}refresh();
};
window.markDone=async function(id){
  if(!confirmedPhotos[id]){alert('طابق رقم الترابيزة في الصورة ووافق عليه أولًا. لو الصورة انتهت، تأكد مباشرة من الترابيزة.');return;}
  var result=await sb.from('orders').update({status:'done'}).eq('id', id);
  if(result.error){alert('لم يتم حفظ التغيير. حاول مرة أخرى');return;}
  refresh();
};


async function startAuthed(){
  var allowed=await sb.rpc('is_staff');if(allowed.error||allowed.data!==true){document.getElementById('login-err').textContent='الحساب ده مش مصرح له بالإدارة.';return;}
  document.getElementById('login-card').style.display='none';
  document.getElementById('live').style.display='block';
  await loadNames();
  await refresh();
  setInterval(refresh, 30000);
  sb.channel('orders-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'orders'}, function(){ refresh(); })
    .subscribe();
}

document.getElementById('login-btn').addEventListener('click', async function(){
  var err=document.getElementById('login-err'); err.textContent='';
  var r=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(), password:document.getElementById('pw').value});
  if(r.error){ err.textContent='بيانات الدخول غير صحيحة'; return; }
  startAuthed();
});

sb.auth.getSession().then(function(r){ if(r.data && r.data.session) startAuthed(); });
</script>
</body>
</html>
